<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERLAB ―その数値を見逃すな―</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eceae4;
    --panel: #ffffff;
    --ink: #1b1f27;
    --ink-dim: #5d636e;
    --line: #c6c9d0;
    --line-strong: #8b909a;
    --head: #2b3646;
    --head-ink: #f2f4f7;
    --warn: #fbf0c4;
    --panic: #f6d4d4;
    /* 割り込み中のヘッダー。値の重さではなく画面状態の合図なので、必ず文字と併せて使う */
    --alert: #7f1d21;
    /* 症例0の指さし。説明の指し示しであって値の判定ではない。割り込みの赤とぶつからない黄色 */
    --point: #dd9b00;
    /* 数字と画面まわり。BIZ UDGothic は数字の幅がそろうので、桁が縦に並ぶ。
       Osaka-Mono は mac、Consolas は Windows、MS Gothic は古い環境向けの控え。Webフォントは使わない */
    --num: "BIZ UDGothic", "Osaka-Mono", Consolas, "Courier New", "MS Gothic", monospace;
    /* 読ませる文章。等幅を外して詰まりを減らす */
    --sans: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--num);
    font-size: 15px;
    line-height: 1.55;
  }

  /* ---- header ---- */
  .app-header {
    background: var(--head);
    color: var(--head-ink);
    padding: 7px 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
    border-bottom: 2px solid #101620;
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .14em; }
  .brand .sub { font-size: 13px; font-weight: 400; letter-spacing: .04em; margin-left: 6px; opacity: .85; }
  .app-header .meta { font-size: 13px; opacity: .9; }
  .app-header .score { font-size: 13px; border: 1px solid #6b7686; padding: 2px 8px; }
  .header-btn {
    margin-left: auto; font: inherit; font-size: 13px; color: var(--head-ink);
    background: transparent; border: 1px solid #6b7686; padding: 2px 8px; cursor: pointer;
  }
  /* 割り込み中。赤は「ERから至急が入っている」画面状態の合図で、値の判定ではない。
     色を消しても分かるよう、ヘッダーには必ず文字の札を出す */
  body[data-state="interrupt"] .app-header { background: var(--alert); border-bottom-color: #40090b; }
  .alert-badge {
    font-size: 13px; font-weight: 700; letter-spacing: .08em;
    border: 1px solid var(--head-ink); padding: 2px 8px;
  }

  /* ---- 指導役 ---- */
  .mentor-lead { font-family: var(--sans); font-size: 15px; color: var(--ink-dim); margin: 0 0 10px; }
  .mentor-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .mentor {
    display: grid; gap: 3px; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: #fbfbf9; border: 1px solid var(--line); border-left: 3px solid var(--line-strong);
    padding: 10px 12px;
  }
  .mentor.is-selected { border-left-color: var(--head); background: #eef1f6; }
  .mentor-name { font-weight: 700; font-size: 18px; }
  .mentor-role { font-size: 13px; color: var(--ink-dim); }
  .mentor-tagline { font-size: 15px; }
  .mentor-style { font-family: var(--sans); font-size: 14px; color: var(--ink-dim); }

  /* ---- tabs (narrow only) ---- */
  .tabs { display: none; background: #dcdad4; border-bottom: 1px solid var(--line-strong); }
  .tab {
    flex: 1; padding: 10px 4px; font: inherit; font-size: 15px;
    background: transparent; border: 0; border-bottom: 3px solid transparent;
    color: var(--ink-dim); cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--head); background: var(--panel); }

  /* ---- columns ---- */
  .cols {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 340px;
    gap: 8px;
    padding: 8px;
    align-items: start;
  }
  .col { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
  .col-title {
    margin: 0; padding: 6px 8px; font-size: 13px; letter-spacing: .1em;
    background: #e3e1db; border-bottom: 1px solid var(--line); font-weight: 700;
  }
  .col-title span { font-weight: 400; letter-spacing: 0; color: var(--ink-dim); margin-left: 8px; }
  .col > div { padding: 8px; }
  .col-messages > div { max-height: calc(100vh - 140px); overflow-y: auto; }

  /* ---- worklist ---- */
  .worklist { list-style: none; margin: 0; padding: 0; }
  .wl-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0 6px;
    width: 100%; text-align: left; font: inherit;
    background: #fbfbf9; border: 1px solid var(--line); border-left: 3px solid var(--line-strong);
    padding: 6px 7px; margin-bottom: 5px; cursor: pointer;
  }
  .wl-row.is-selected { border-left-color: var(--head); background: #eef1f6; }
  /* 割り込みで先頭に上がった検体。文字（至急⚑・割り込み）を主にし、点滅は数秒でやめる */
  .wl-row.is-interrupt { border-left-color: var(--alert); border-left-width: 5px; }
  .wl-row.is-interrupt .wl-mark { font-weight: 700; }
  .wl-row.is-blinking { animation: cut-in .6s steps(1, end) 6; }
  @keyframes cut-in { 50% { background: var(--panic); } }
  @media (prefers-reduced-motion: reduce) { .wl-row.is-blinking { animation: none; } }
  .wl-acc { font-size: 13px; color: var(--ink-dim); }
  .wl-mark { font-size: 12px; text-align: right; white-space: pre; }
  .wl-pt { font-weight: 700; }
  .wl-from, .wl-order { font-size: 13px; color: var(--ink-dim); }
  .wl-status { font-size: 13px; text-align: right; }
  .wl-title { grid-column: 1 / -1; font-size: 13px; color: var(--ink-dim); border-top: 1px dotted var(--line); margin-top: 4px; padding-top: 4px; }

  /* ---- patient head ---- */
  .pt-head { border: 1px solid var(--line); background: #fbfbf9; padding: 7px 9px; margin-bottom: 10px; }
  .pt-line { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .pt-line + .pt-line { margin-top: 3px; }
  .pt-acc, .pt-time, .pt-from, .pt-demo { font-size: 13px; color: var(--ink-dim); }
  .pt-id { font-weight: 700; }
  .pt-name { font-weight: 700; }
  /* 患者情報欄は読ませる欄なので等幅を外す */
  .pt-meta { display: grid; grid-template-columns: 6em 1fr; gap: 3px 8px; margin: 8px 0 0; font-size: 15px; }
  .pt-meta dt { color: var(--ink-dim); font-family: var(--sans); }
  .pt-meta dd { margin: 0; font-family: var(--sans); }
  /* 検体状態はコメントがあるときだけ目立たせる。太字と枠も併せて付け、色だけの手がかりにしない */
  .pt-meta dd.is-flagged {
    font-weight: 700; display: inline-block;
    background: var(--warn); border: 1px solid var(--line-strong); border-left: 4px solid var(--ink);
    padding: 1px 8px;
  }

  /* ---- result table ---- */
  /* 数字は右揃え＋等幅で縦にそろえる。tabular-nums は、別のフォントに落ちた環境向けの保険 */
  .lis-table {
    width: 100%; border-collapse: collapse; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  .lis-table caption {
    text-align: left; font-size: 13px; font-weight: 700; letter-spacing: .08em;
    background: #e3e1db; border: 1px solid var(--line); padding: 4px 6px;
  }
  .lis-table th, .lis-table td { border: 1px solid var(--line); padding: 4px 7px; text-align: right; }
  .lis-table thead th { background: #f0efeb; font-size: 13px; color: var(--ink-dim); text-align: right; font-weight: 400; }
  .lis-table thead th:first-child { text-align: left; }
  .lis-table.has-mark thead th:first-child { text-align: center; }
  .lis-table.has-mark thead th:nth-child(2) { text-align: left; }
  .lis-table tbody th { text-align: left; font-weight: 400; }
  .lis-table td[data-col="unit"], .lis-table td[data-col="ref"] { color: var(--ink-dim); font-size: 13px; }
  .lis-table td[data-col="value"] { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .lis-table td[data-col="prev"] { color: var(--ink-dim); white-space: nowrap; }
  .lis-table tr.is-flagged td[data-col="value"] { text-decoration: underline; text-underline-offset: 2px; }
  /* 危険域（パニック値）。値の話だけをする欄なので、色も枠も付けない。
     どうするかは検体状態を見てから決めるので、ここには書かない */
  .danger-range { display: block; font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
  /* HH / LL に添える札。記号だけでは重さが伝わらないので言葉でも出す。行動は書かない */
  .panic-note { display: block; font-size: 11px; line-height: 1.3; white-space: nowrap; }
  .lis-table .lbl { display: none; }

  /* ---- マーク（選択状態） ---- */
  /* 行の反転は色ルールの例外。値の重さではなく「報告に載せる行を選んだ」ことだけを示す。
     反転だけに頼らないよう、印欄の記号と aria-pressed を必ず併せて出す */
  .lis-table td[data-col="mark"] { text-align: center; padding: 4px 5px; }
  .mark-box {
    display: inline-block; width: 1.3em; height: 1.3em; line-height: 1.25em;
    border: 1px solid currentColor; text-align: center; font-size: 13px;
  }
  .lis-table tr[data-mark] { cursor: pointer; }
  .lis-table tr[data-mark]:focus-visible { outline: 3px solid var(--head); outline-offset: -3px; }
  .lis-table tr.is-marked { background: var(--head); color: var(--head-ink); }
  .lis-table tr.is-marked .t-name,
  .lis-table tr.is-marked td[data-col="unit"],
  .lis-table tr.is-marked td[data-col="ref"],
  .lis-table tr.is-marked td[data-col="prev"] { color: #d2d9e4; }
  .lis-table tr.is-marked .test-name { color: inherit; }
  .lis-table tr.is-marked .delta { border-color: currentColor; }
  /* フラグ欄は淡い地色のままなので、反転行では文字色を戻す */
  .lis-table tr.is-marked td[data-col="flag"].is-warn,
  .lis-table tr.is-marked td[data-col="flag"].is-panic { color: var(--ink); }

  /* ---- 疑いタブ ---- */
  .suspect-row td { background: #eef1f6; padding: 6px 7px; text-align: left; }
  .suspects { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .suspects-label { font-size: 13px; color: var(--ink-dim); }
  .suspect {
    font: inherit; font-size: 14px; padding: 4px 9px; min-height: 34px;
    background: #fbfbf9; border: 1px solid var(--line-strong); cursor: pointer;
  }
  .suspect.is-on { background: var(--head); color: var(--head-ink); border-color: #101620; font-weight: 700; }
  .suspect-check { display: inline-block; min-width: 1.1em; }
  .suspect:disabled { cursor: default; opacity: .75; }

  .test-name { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline dotted; }
  .t-abbr { font-weight: 700; }
  .t-name { color: var(--ink-dim); font-size: 13px; margin-left: 6px; }

  /* フラグは記号が主。色はそのセルだけに付ける補助で、色を消しても H/L/HH/LL で判断できること */
  .flag { display: inline-block; min-width: 2.2em; font-weight: 700; letter-spacing: .05em; }
  .flag-panic { border: 1px solid var(--ink); padding: 0 3px; }
  .lis-table td[data-col="flag"].is-warn { background: var(--warn); }
  .lis-table td[data-col="flag"].is-panic { background: var(--panic); }
  .delta { margin-left: 4px; border: 1px solid var(--ink); padding: 0 2px; font-size: 12px; }

  .recollect { border-top: 2px solid var(--head); margin-top: 6px; padding-top: 10px; }
  .recollect-head {
    margin: 0 0 6px; padding: 5px 6px; font-size: 13px; letter-spacing: .08em;
    background: #e3e1db; border: 1px solid var(--line);
  }

  .hint { font-family: var(--sans); font-size: 13px; color: var(--ink-dim); margin: 0 0 10px; }
  .error { font-family: var(--sans); color: var(--ink); border: 2px solid var(--ink); padding: 10px; }

  .lis-actions { display: flex; gap: 8px; padding: 0 8px 10px; }

  .btn {
    font: inherit; font-size: 15px; padding: 8px 16px; background: #f0efeb;
    border: 1px solid var(--line-strong); cursor: pointer; min-height: 40px;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--head); color: var(--head-ink); border-color: #101620; font-weight: 700; }

  /* ---- 指さし ---- */
  /* ナビの一文から、画面のどこを見るかを示す。枠が点いて2秒でゆっくり消える。
     点滅させない（割り込みの点滅と区別する） */
  .point {
    font: inherit; font-size: 12px; margin-left: 6px; padding: 1px 7px; vertical-align: 1px;
    background: var(--panel); border: 1px solid var(--head); color: var(--head);
    cursor: pointer; white-space: nowrap;
  }
  /* 指さし。枠は時間で消さない——症例0は次の文に進むまで、症例1〜3は次の「ここ」を押すまで。
     初見でも目が行く黄色5px。点滅はさせず（割り込みの点滅と区別する）、
     現れるときに0.3秒で線が引かれる動きを一度だけ。値の判定ではないので色ルールの外 */
  .is-pointed { position: relative; }
  .is-pointed::after {
    content: ""; position: absolute; inset: -3px; pointer-events: none;
    border: 5px solid var(--point);
    animation: point-draw .3s linear 1 both;
  }
  @keyframes point-draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) { .is-pointed::after { animation: none; } }

  /* ---- messages ---- */
  .msg { border: 1px solid var(--line); border-left: 3px solid var(--line-strong); background: #fbfbf9; padding: 7px 9px; margin-bottom: 9px; }
  .msg-nav { border-left-color: var(--head); background: #eef1f6; }
  .msg-kind { font-size: 12px; border: 1px solid var(--line-strong); padding: 0 4px; }
  .msg-time { font-size: 12px; color: var(--ink-dim); margin-left: 6px; }
  .msg-subject { font-family: var(--sans); font-size: 15px; margin: 4px 0 1px; }
  .msg-from { font-size: 13px; color: var(--ink-dim); margin: 0 0 6px; }
  /* 申し送り・ナビ・講評・医師の返信。読ませる文章なので本文だけ一段大きく */
  .msg p { font-family: var(--sans); font-size: 16px; line-height: 1.75; margin: 0 0 7px; }
  .empty { font-family: var(--sans); color: var(--ink-dim); }

  /* 指導役の台詞は立ち絵を左、台詞を右に置く。
     大きさは高さで決める。絵の幅（かなえ306px・悠介928px）が変わっても人物の大きさは変えない。
     左の列は絵の幅なりに広がる（auto）ので、幅の違う絵が混ざっても崩れない */
  .msg.has-portrait { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; }
  .msg-portrait { height: 112px; width: auto; display: block; background: #fff; border: 1px solid var(--line); }
  .msg-main { min-width: 0; }

  /* ---- 症例0（チュートリアル） ---- */
  .tut-title { display: flex; align-items: baseline; gap: 8px; }
  .tut-step { font-size: 13px; font-weight: 400; color: var(--ink-dim); border: 1px solid var(--line-strong); padding: 0 5px; }
  .tut-focus { font-family: var(--sans); font-size: 13px; color: var(--ink-dim); margin: -4px 0 10px; }
  .tut-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
  .tut-portrait { height: 173px; width: auto; display: block; background: #fff; border: 1px solid var(--line); }
  .tut-lines { font-family: var(--sans); font-size: 16px; line-height: 1.8; }
  .tut-lines p { margin: 0 0 9px; }
  .tut-from { font-family: var(--num); font-size: 13px; color: var(--ink-dim); margin: 0 0 8px; }
  .tut-placeholder {
    font-family: var(--sans); font-size: 15px; color: var(--ink-dim); text-align: center;
    border: 1px dashed var(--line-strong); padding: 22px 12px; margin: 0 0 10px;
  }

  /* 症例0の説明は画面を覆わない。下に寄せた帯にして、上半分に受付一覧と結果画面を見せる。
     指さしが帯の裏に隠れないよう、送り先を上寄りにする（scroll-padding） */
  #tutorial-dialog {
    position: fixed; inset: auto 0 0 0; width: 100%; max-width: none; margin: 0;
    max-height: 46vh; overflow-y: auto;
    border-width: 3px 0 0; box-shadow: 0 -6px 18px rgba(20, 24, 32, .22);
  }
  #tutorial-dialog::backdrop { background: transparent; }
  html[data-tutorial="open"] { scroll-padding: 12px 0 52vh; }
  /* 帯のぶんの逃げを作る。これがないと、画面の下にあるもの（報告ボタン）を
     上へ送れず、帯の裏に入ったままになる */
  html[data-tutorial="open"] .cols { padding-bottom: 52vh; }
  /* 症例0の報告ボタンは押せないが、薄くしない。半透明にすると指さしの枠まで一緒に薄くなる
     （枠は疑似要素なので、親の透明度から出られない）。押せないことは字の色で見せる */
  html[data-tutorial="open"] .btn:disabled { opacity: 1; color: var(--ink-dim); border-color: var(--line); }

  /* チュートリアル中の骨組み。数字は入らない */
  .lis-table.is-skeleton td[data-col="value"],
  .pt-head.is-skeleton .pt-name { color: var(--ink-dim); font-weight: 400; }
  .lis-table.is-skeleton td[data-col="flag"] { min-width: 2.6em; }

  /* ---- dialogs ---- */
  dialog { border: 2px solid var(--head); background: var(--panel); color: var(--ink); padding: 0; width: min(600px, 94vw); }
  dialog::backdrop { background: rgba(20, 24, 32, .55); }
  dialog > div { padding: 14px; }
  dialog h2 { font-size: 17px; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  fieldset { border: 1px solid var(--line); margin: 0 0 12px; padding: 7px; }
  legend { font-size: 13px; color: var(--ink-dim); padding: 0 4px; }
  .lv { display: flex; gap: 8px; align-items: flex-start; padding: 7px 5px; border-bottom: 1px dotted var(--line); cursor: pointer; }
  .lv:last-child { border-bottom: 0; }
  .lv input { margin-top: 4px; }
  .lv-body { display: block; }
  .lv-label { display: block; font-weight: 700; font-size: 16px; }
  .lv-action { display: block; font-size: 14px; }
  .lv-when { display: block; font-size: 14px; color: var(--ink-dim); font-family: var(--sans); }
  .report-marks {
    font-size: 15px; background: #f0efeb; border: 1px solid var(--line-strong);
    padding: 6px 8px; margin: 0 0 12px;
  }
  .report-marks-label { font-size: 12px; border: 1px solid var(--line-strong); padding: 0 4px; margin-right: 8px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 4px; }
  /* コメントは候補のタップで組む。自由記述の欄は置かない */
  .comment-options { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .comment-opt {
    display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left;
    font: inherit; font-size: 15px; font-family: var(--sans); padding: 8px 9px; min-height: 40px;
    background: #fbfbf9; border: 1px solid var(--line-strong); cursor: pointer;
  }
  .comment-opt.is-on { background: var(--head); color: var(--head-ink); border-color: #101620; font-weight: 700; }
  .comment-opt:disabled { opacity: .5; cursor: default; }
  .comment-check { display: inline-block; min-width: 1.1em; font-family: var(--num); }
  .comment-count, .comment-empty { font-family: var(--sans); font-size: 13px; color: var(--ink-dim); margin: 6px 0 0; }
  .verdict-comment { list-style: none; margin: 6px 0 0; padding: 0; font-family: var(--sans); font-size: 14px; }
  .verdict-comment li { border-left: 3px solid var(--line-strong); padding: 2px 8px; margin-bottom: 3px; }
  .check { display: flex; gap: 6px; align-items: center; }

  .phone-dial { border: 1px solid var(--line-strong); background: #f0efeb; padding: 7px; text-align: center; }
  .phone-script { font-family: var(--sans); font-size: 15px; }
  .phone-value { font-family: var(--num); font-size: 17px; font-weight: 700; border: 1px solid var(--ink); padding: 6px; text-align: center; }

  .verdict-choice { font-size: 14px; }
  .score-badge { display: inline-block; border: 1px solid var(--ink); padding: 0 7px; margin-right: 7px; font-size: 13px; vertical-align: middle; }
  .score-best { background: var(--ink); color: var(--panel); }
  .score-poor { border-style: dashed; }
  /* 差し戻し。まだ評価が確定していない（二本目を報告してから決まる） */
  .score-pending { border-style: double; border-width: 3px; font-weight: 700; }
  .verdict-note, .gl-foot, .gl-derived { font-family: var(--sans); font-size: 13px; color: var(--ink-dim); }

  /* ---- glossary ---- */
  /* 語のリンク。項目名の索引と同じ見た目にそろえる（点線の下線） */
  .term {
    font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px;
  }
  .term-help {
    font: inherit; font-size: 12px; line-height: 1; margin-left: 3px; padding: 2px 5px;
    background: #fbfbf9; border: 1px solid var(--line-strong); border-radius: 50%;
    color: var(--ink-dim); cursor: pointer; min-height: 24px;
  }
  .suspect-wrap { display: inline-flex; align-items: center; }

  /* 語を指定して開くとその語まで送るので、タブは上に貼り付けて always 押せるようにする */
  .gl-tabs {
    display: flex; gap: 0; margin: -14px -14px 12px; background: #dcdad4;
    border-bottom: 1px solid var(--line-strong); position: sticky; top: -14px; z-index: 2;
  }
  .gl-tab {
    flex: 1; padding: 9px 4px; font: inherit; font-size: 15px; cursor: pointer;
    background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--ink-dim);
  }
  .gl-tab.is-selected { color: var(--ink); font-weight: 700; border-bottom-color: var(--head); background: var(--panel); }
  .gl-empty { font-family: var(--sans); color: var(--ink-dim); }

  /* 見る順番。答えではなく手順なので、どの症例でも同じ五行を出す */
  .reading-order { border: 2px solid var(--head); background: #eef1f6; padding: 9px 11px; margin-bottom: 14px; }
  .reading-order h2 { font-size: 15px; margin: 0 0 7px; border: 0; padding: 0; letter-spacing: .1em; }
  .reading-order ol { list-style: none; margin: 0; padding: 0; }
  .reading-order li { display: grid; grid-template-columns: 1.6em 6.5em 1fr; gap: 0 6px; align-items: baseline; padding: 3px 0; }
  .ro-no { font-size: 13px; color: var(--ink-dim); }
  .ro-term { font-weight: 700; }
  .ro-hint { font-family: var(--sans); font-size: 14px; color: var(--ink-dim); }
  .ro-note { font-family: var(--sans); font-size: 13px; color: var(--ink-dim); margin: 7px 0 0; }

  .term-card { border-bottom: 1px dotted var(--line); padding: 8px 6px; }
  .term-card:last-child { border-bottom: 0; }
  .term-card h3 { font-size: 16px; margin: 0 0 4px; }
  .term-card.is-current { background: var(--warn); border-left: 4px solid var(--ink); padding-left: 8px; }
  .term-alias { font-size: 12px; font-weight: 400; color: var(--ink-dim); margin-left: 8px; }
  .term-card p { font-family: var(--sans); font-size: 15px; line-height: 1.7; margin: 0 0 3px; }

  .gl-title { font-size: 17px; }
  .gl-unit { font-size: 13px; color: var(--ink-dim); margin-left: 8px; }
  .glossary { margin: 0; }
  .glossary dt { font-size: 14px; font-weight: 700; background: #e3e1db; padding: 3px 6px; margin-top: 8px; }
  .glossary dd { margin: 5px 0 0; font-family: var(--sans); font-size: 16px; line-height: 1.75; }
  .glossary .sub { color: var(--ink-dim); font-family: var(--num); font-size: 13px; }

  /* ---- narrow screens: tabs + stacked table rows ---- */
  @media (max-width: 899px) {
    .tabs { display: flex; }
    .cols { grid-template-columns: 1fr; padding: 6px; }
    body[data-view="worklist"] .col-lis,
    body[data-view="worklist"] .col-messages,
    body[data-view="lis"] .col-worklist,
    body[data-view="lis"] .col-messages,
    body[data-view="messages"] .col-worklist,
    body[data-view="messages"] .col-lis { display: none; }
    .col-messages > div { max-height: none; }
  }

  /* 幅が足りないぶんは横スクロールにせず、1行を2段に畳む。
     1段目に 項目・結果・単位・フラグ、2段目に 基準範囲・前回値 */
  @media (max-width: 700px) {
    .lis-table thead { display: none; }
    .lis-table, .lis-table tbody, .lis-table tr, .lis-table th, .lis-table td { display: block; }
    .lis-table caption { display: block; }
    .lis-table tr {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto minmax(2.8em, auto);
      grid-template-areas: "name value unit flag" "ref ref prev prev";
      border: 1px solid var(--line);
      border-top: 0;
      align-items: baseline;
      padding: 5px 6px;
    }
    /* マーク欄のぶんを1列足す。再採血検体の表（印欄なし）は元の4列のまま */
    .lis-table.has-mark tr {
      grid-template-columns: 2em minmax(0, 1fr) auto auto minmax(2.8em, auto);
      grid-template-areas: "mark name value unit flag" "mark ref ref prev prev";
    }
    .lis-table td[data-col="mark"] { grid-area: mark; align-self: center; }
    .lis-table tr.suspect-row { display: block; padding: 0; border-top: 0; }
    .lis-table tbody tr:first-child { border-top: 1px solid var(--line); }
    .lis-table th, .lis-table td { border: 0; padding: 0 4px; }
    .lis-table th[data-col="name"] { grid-area: name; }
    .lis-table td[data-col="value"] { grid-area: value; font-size: 18px; }
    .lis-table td[data-col="unit"] { grid-area: unit; }
    .lis-table td[data-col="ref"] { grid-area: ref; text-align: left; }
    .lis-table td[data-col="flag"] { grid-area: flag; text-align: center; padding: 1px 2px; }
    .lis-table td[data-col="prev"] { grid-area: prev; }
    .lis-table .lbl { display: inline; margin-right: 4px; }
    .t-name { display: none; }
    .wl-title { display: none; }
    .pt-meta { grid-template-columns: 5.5em 1fr; }
    .tut-body { gap: 10px; }
    .tut-portrait { height: 127px; }
    .msg-portrait { height: 96px; }
  }
</style>
</head>
<body data-view="lis">

<header class="app-header">
  <div class="brand">ERLAB<span class="sub">―その数値を見逃すな―</span></div>
  <div class="meta"><span id="hospital-name">読み込み中…</span> ／ 新人研修モード（時間無制限）</div>
  <span class="alert-badge" id="header-alert" hidden></span>
  <button class="header-btn" id="mentor-btn" type="button" data-action="open-mentor">指導役 —</button>
  <div class="score" id="score">報告 0件</div>
</header>

<nav class="tabs" aria-label="画面切替">
  <button class="tab" type="button" data-view-target="worklist" aria-selected="false">受付一覧</button>
  <button class="tab" type="button" data-view-target="lis" aria-selected="true">検査結果</button>
  <button class="tab" type="button" data-view-target="messages" aria-selected="false">メッセージ</button>
</nav>

<main class="cols">
  <section class="col col-worklist">
    <h2 class="col-title">受付一覧</h2>
    <div id="pane-worklist" data-region="reception"></div>
  </section>

  <section class="col col-lis">
    <h2 class="col-title">検査結果<span id="case-title"></span></h2>
    <div id="pane-lis"><p>読み込み中…</p></div>
    <div class="lis-actions">
      <button class="btn btn-primary" id="btn-report" type="button" data-action="open-report" data-region="report">報告する</button>
      <button class="btn" id="btn-next" type="button" hidden>次の症例へ</button>
    </div>
  </section>

  <section class="col col-messages">
    <h2 class="col-title">院内メッセージ</h2>
    <div id="pane-messages" data-region="messages"></div>
  </section>
</main>

<dialog id="mentor-dialog"><div id="mentor-body"></div></dialog>

<dialog id="tutorial-dialog"><div id="tutorial-body"></div></dialog>

<dialog id="report-dialog"><div id="report-body"></div></dialog>

<dialog id="glossary-dialog">
  <div>
    <div id="glossary-body"></div>
    <div class="dlg-actions">
      <button class="btn" type="button" data-action="close-glossary">閉じる</button>
    </div>
  </div>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
